  <section id="sec02">

    <section class="secao-depoimentos">

      <div class="carrossel-wrapper">
        <!-- Âncoras invisíveis que controlam o estado manual (:target) -->
        <span id="slide-1" class="ancora"></span>
        <span id="slide-2" class="ancora"></span>
        <span id="slide-3" class="ancora"></span>

        <!-- Janela central que exibe apenas 1 cartão por vez -->
        <div class="janela-cartao">
          <div class="trilho">

            <!-- Depoimento 1 -->
            <article class="slide">
              <div class="coluna-imagem">
                <img src="Promocoes-1.png" alt="">
              </div>
            </article>

            <!-- Depoimento 2 -->
            <article class="slide">
              <div class="coluna-imagem">
                <img src="Promocoes-2.png" alt="">
              </div>
            </article>

            <!-- Depoimento 3 -->
            <article class="slide">
              <div class="coluna-imagem">
                <img id="img-var" src="fundo-aleatorio.png" alt="">
              </div>
            </article>

          </div>
        </div>

        <!-- Setas Laterais (Sincronizadas com o slide ativo) -->
        <div class="setas-grupo s1">
          <a href="#slide-3" class="controle prev"><span>PREV</span> &larr;</a>
          <a href="#slide-2" class="controle next"><span>NEXT</span> &rarr;</a>
        </div>
        <div class="setas-grupo s2">
          <a href="#slide-1" class="controle prev"><span>PREV</span> &larr;</a>
          <a href="#slide-3" class="controle next"><span>NEXT</span> &rarr;</a>
        </div>
        <div class="setas-grupo s3">
          <a href="#slide-2" class="controle prev"><span>PREV</span> &larr;</a>
          <a href="#slide-1" class="controle next"><span>NEXT</span> &rarr;</a>
        </div>

        <!-- Indicadores Inferiores (Bolinhas) -->
        <nav class="paginacao" aria-label="Navegação de slides">
          <a href="#slide-1" class="ponto p1" aria-label="Ir para slide 1"></a>
          <a href="#slide-2" class="ponto p2" aria-label="Ir para slide 2"></a>
          <a href="#slide-3" class="ponto p3" aria-label="Ir para slide 3"></a>
        </nav>
      </div>
    </section>
